# Release - builds the targets scripts/bin-release.sh did not build on the machine publishing,
# and uploads them to that version's draft release.
name: Release
run-name: Release ${{ github.ref_name }} (built locally ${{ inputs.local_target }})
on:
  workflow_dispatch:
    inputs:
      build_only:
        description: Build the archives as workflow artifacts, without uploading to a release
        type: boolean
        default: false
      local_target:
        description: Target the publishing machine already built and uploaded
        required: true
        type: choice
        options:
          - aarch64-apple-darwin
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
        # Left out of the matrix rather than skipped step by step: a skipped job still waits for
        # a runner, and macOS ones can go unassigned, failing the run and the upload with it.
        exclude:
          - target: ${{ inputs.local_target }}
    # 22.04 for its older glibc (2.35), which the executable then asks no newer than.
    runs-on: ${{ fromJSON('{"aarch64-apple-darwin":"macos-15","x86_64-unknown-linux-gnu":"ubuntu-22.04","aarch64-unknown-linux-gnu":"ubuntu-22.04-arm"}')[matrix.target] }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # .gitmodules names the submodules by SSH, which a runner has no key for. They are public.
      - name: Check out submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive
      - name: Read the version
        id: version
        env:
          BUILD_ONLY: ${{ inputs.build_only }}
        run: |
          tag="v$(bash scripts/_internal/version.sh)"
          if [ "$BUILD_ONLY" != true ]; then
            test "$GITHUB_REF" = "refs/tags/$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Install Rust
        run: |
          rustup toolchain install 1.95.0 --profile minimal --no-self-update --target wasm32-unknown-unknown
          rustup default 1.95.0
      # From ziglang.org, checked against its published sha256: mlugg/setup-zig still runs on
      # Node 20, which the runners are dropping.
      - name: Install Zig
        env:
          ZIG_VERSION: 0.15.2
          # The runner's "$RUNNER_ARCH-$RUNNER_OS" to the name ziglang.org gives its build.
          ZIG_HOST_OF_RUNNER: |
            {
              "X64-Linux": "x86_64-linux",
              "ARM64-Linux": "aarch64-linux",
              "ARM64-macOS": "aarch64-macos"
            }
        run: |
          runner="$RUNNER_ARCH-$RUNNER_OS"
          zig_host="$(jq -er --arg runner "$runner" '.[$runner]' <<<"$ZIG_HOST_OF_RUNNER")"

          curl -fsSL -o "$RUNNER_TEMP/zig-index.json" https://ziglang.org/download/index.json
          zig_build="$(jq -e --arg version "$ZIG_VERSION" --arg host "$zig_host" \
            '.[$version][$host]' "$RUNNER_TEMP/zig-index.json")"
          tarball_url="$(jq -er .tarball <<<"$zig_build")"
          tarball_sha256="$(jq -er .shasum <<<"$zig_build")"

          tarball="$RUNNER_TEMP/zig.tar.xz"
          curl -fsSL -o "$tarball" "$tarball_url"
          echo "$tarball_sha256  $tarball" | shasum -a 256 -c -

          tar -xJf "$tarball" -C "$RUNNER_TEMP"
          zig_folder="$RUNNER_TEMP/$(basename "$tarball_url" .tar.xz)"
          echo "$zig_folder" >> "$GITHUB_PATH"
      - name: Build and package
        run: bash scripts/_internal/build-release.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: moonreview-${{ matrix.target }}
          # The folder named in full, so the artifact holds the files without it, and the upload
          # job can hand them to the release as they are.
          path: target/release-artifacts/${{ steps.version.outputs.tag }}/moonreview-${{ matrix.target }}.tar.gz*
          if-no-files-found: error
          retention-days: 7
  upload:
    if: ${{ !inputs.build_only }}
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true
          gh release upload "$GITHUB_REF_NAME" release-artifacts/* --clobber

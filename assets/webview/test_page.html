<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 14px -apple-system, sans-serif; margin: 0; padding: 24px;
         background: linear-gradient(135deg, #1e3a5f, #3b1e5f); color: #f0f0f0; min-height: 100vh; box-sizing: border-box; }
  h1 { margin-top: 0; }
  button { font-size: 16px; padding: 6px 14px; }
  input { font-size: 14px; padding: 4px; width: 240px; }
  .corner { position: fixed; width: 14px; height: 14px; background: #ff3b30; }
</style>
</head>
<body>
  <div class="corner" style="top:0;left:0"></div>
  <div class="corner" style="top:0;right:0"></div>
  <div class="corner" style="bottom:0;left:0"></div>
  <div class="corner" style="bottom:0;right:0"></div>
  <h1>moon test webview</h1>
  <p>A page drawn by the system webview, inside a moon pane. The red squares mark its corners.</p>
  <p><button id="count">clicked 0 times</button></p>
  <p><input id="typed" placeholder="type here"> <span id="echo"></span></p>
  <p id="size"></p>
  <script>
    let clicks = 0;
    const button = document.getElementById("count");
    button.addEventListener("click", () => { clicks += 1; button.textContent = `clicked ${clicks} times`; });
    const typed = document.getElementById("typed");
    typed.addEventListener("input", () => { document.getElementById("echo").textContent = typed.value; });
    const size = () => { document.getElementById("size").textContent = `viewport ${innerWidth} x ${innerHeight}`; };
    addEventListener("resize", size); size();
  </script>
</body>
</html>

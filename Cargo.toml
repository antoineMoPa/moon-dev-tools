[package]
name = "moon-review"
version = "0.28.0"
edition = "2024"

# One library, one executable. `moon` opens a window on a review, the task board or a shell —
# the same window, on three different things — and reaches the windows that are already open;
# `src/bin/moon.rs` is a single call into the library.
[lib]
name = "moonreview"
path = "src/lib.rs"

[[bin]]
name = "moon"
path = "src/bin/moon.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
eframe = { version = "0.36", features = ["persistence"] }
egui = "0.36"
# Renders the markdown files the file pane opens — task notes above all.
egui_commonmark = "0.25"
egui_extras = { version = "0.36", features = ["image"] }
# The tab, split and terminal widgets, kept as crates of their own: submodules under crates/,
# published separately, and used here like any other dependency. egui_tty compiles libghostty-vt
# from Ghostty source, so a Zig 0.15.x toolchain has to be on PATH to build this.
egui_frames = { version = "0.4", path = "crates/egui_frames", features = ["serde"] }
# In the browser as well: Ghostty's VT engine builds for wasm - see
# crates/libghostty-vt-sys/VENDORED.md.
egui_tty = { version = "0.2", path = "crates/egui_tty" }
# The code editor a file tab holds: the buffer, the fringe of line numbers, and the marks a
# search draws into the text.
# `serde` for the one setting of it a repo writes down: how its files are indented, which the
# project file carries - see `crate::project`.
egui_moon_editor = { version = "0.1", path = "crates/egui_moon_editor", features = ["serde"] }
# The seam between the two above: when a server is owed the text, when a half-typed word is
# worth a question, and what a ⌘-click can expect of a server that is still indexing. A crate
# of its own so that an editor with go-to-definition is not something every application has to
# write again; what stays here is the part that is this product's - panes, the palette, the
# `ag` fallback for the languages nobody installed a server for.
egui_moon_code_ide = { version = "0.1", path = "crates/egui_moon_code_ide" }
futures = "0.3.33"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
# Codex's own rules for what in an agent's answer is a visualization: a directive line only
# counts outside a code block, which takes a markdown parser to tell - see
# The language server client — the process, the framing, the position arithmetic, and a
# server per workspace. A crate of its own the way the widgets above are; `src/lsp` is only
# what turns a review session into a workspace it can answer about.
moon_lsp = { version = "0.1", path = "crates/moon_lsp" }
# `src/visualizations/directives.rs`.
pulldown-cmark = { version = "0.13", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
# The day a Codex thread was started on, off its UUIDv7 id, and when a line of its rollout was
# written - which is how its visualizations are found. See `src/visualizations/`.
time = { version = "0.3", features = ["parsing"] }
# The developer instructions a person keeps in `~/.codex/config.toml`, which moon has to add to
# rather than replace when it starts Codex - see `src/visualizations/codex_launch.rs`.
toml = "1"
webbrowser = "1"
# `Instant` and `SystemTime` that work in a browser, where std's panic: the window reads the
# clock, and is built for one - see `web/`. std's own everywhere else.
web-time = "1"
# A Codex thread id is a UUIDv7, whose timestamp names the folder its visualizations go in.
uuid = "1"
# The language extensions are written in - see `src/extensions`. A pane that is a script is a
# pane that can be written, and rewritten while the window runs, without building this again.
# `serde` so a script's view is read into the window's own types, and an event it attached to
# a button comes back to it as it was written.
rhai = { version = "1.25.1", features = ["serde"] }

# The menu bar on macOS is a system-wide bar, not part of the window, so it needs the
# platform API. Elsewhere the same actions live in the command palette.

# What the window only needs where it runs as a program of its own: the server behind it, the
# shells, git and the language servers, and the blocking HTTP and websocket it reaches another
# machine's server with. The build for the browser - see `web/` - has none of these: it is only
# ever a window on a server, reached with the browser's own requests and sockets.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8", features = ["json", "ws"] }
# The server's pass keys - see `src/pass_keys.rs`: an id from the OS's randomness, signed with
# HMAC-SHA256 under a secret kept in `~/.moonreview`.
getrandom_03 = { package = "getrandom", version = "0.3" }
hmac = "0.12"
libc = "0.2"
portable-pty = "0.9.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
# The folder picker the window opens on startup when it has no repo to review yet. On Linux it
# asks the desktop portal, so there is no GTK to link against.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }

# The window as a page `moon serve` hands out at `/moon`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# Hash maps down the tree seed themselves from the OS, which in a browser is `crypto`.
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
# The editor's line diff gives up at a deadline, which is `std::time::Instant` - a panic in a
# browser - unless this feature is on.
similar = { version = "3.2", features = ["wasm32_web_time"] }
js-sys = "0.3"
# Pinned: build.rs generates the JavaScript side with wasm-bindgen-cli-support, which has to be
# exactly the version the module was compiled against.
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Location", "Window", "Storage", "XmlHttpRequest", "WebSocket", "BinaryType", "MessageEvent", "UrlSearchParams", "console", "HtmlCanvasElement"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.19", default-features = false }
# Dictation, the emoji picker and the rest of what types without a key press reach the
# window's view as `insertText:`, which winit drops; the view's methods are wrapped to keep
# that text - see `src/native/text_without_a_key.rs`.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAttributedString", "NSObjCRuntime", "NSRange", "NSString"] }
# The system's own webview - WKWebView - put in a pane as a child of the window, for pages
# a pane shows as a browser would draw them. The system's, so no web engine is bundled. See
# `src/native/webview_pane.rs`.
wry = { version = "0.57", default-features = false }

# build.rs builds the window for the browser and embeds it - see there. This is wasm-bindgen's
# command line as a library, so no CLI has to be installed, at the version pinned above.
[build-dependencies]
wasm-bindgen-cli-support = "=0.2.126"
# The page is embedded gzipped - see build.rs.
flate2 = "1"

[dev-dependencies]
# The page's tests unpack it the way a browser does - see src/server_tests/auth.rs.
flate2 = "1"
# Renders the real window contents offscreen, so the UI can be checked without a display.
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }

# A terminal redraw parses and lays out a whole screen per frame, which an unoptimized build
# does 5x slower — enough to make scrolling claude feel a beat behind the trackpad. The
# dependencies carry most of that cost and rarely change, so they are compiled optimized even
# for `cargo run`; the workspace's own code stays at 1 to keep rebuilds quick.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# build.rs runs wasm-bindgen and gzip over the whole browser build - 17 MB - on every build of
# moon whose sources changed. Cargo compiles what a build script uses unoptimized, which makes
# those two take seconds each; these are compiled optimized in every profile instead.
[profile.dev.package.walrus]
opt-level = 3
[profile.dev.package.wasm-bindgen-cli-support]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.release.package.walrus]
opt-level = 3
[profile.release.package.wasm-bindgen-cli-support]
opt-level = 3
[profile.release.package.miniz_oxide]
opt-level = 3
[profile.release.package.flate2]
opt-level = 3

# Ghostty's VT engine built for the browser as well - see crates/libghostty-vt-sys/VENDORED.md.
[patch.crates-io]
libghostty-vt-sys = { path = "crates/libghostty-vt-sys" }

[package]
name = "moon-review"
version = "0.42.0"
edition = "2024"

# One library, one executable. `moon` opens a window on a review, the task board or a shell —
# the same window, on three different things — and reaches the windows that are already open;
# `src/bin/moon.rs` is a single call into the library.

[lib]
name = "moonreview"
path = "src/lib.rs"

[[bin]]
name = "moon"
path = "src/bin/moon.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
eframe = { version = "0.36", features = ["persistence"] }
egui = "0.36"
egui_commonmark = "0.25"
egui_extras = { version = "0.36", features = ["image"] }
egui_frames = { version = "0.4", path = "crates/egui_frames", features = ["serde"] }
egui_tty = { version = "0.2", path = "crates/egui_tty" }
egui_moon_editor = { version = "0.1", path = "crates/egui_moon_editor", features = ["serde"] }
egui_moon_code_ide = { version = "0.1", path = "crates/egui_moon_code_ide" }
futures = "0.3.33"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
moon_lsp = { version = "0.1", path = "crates/moon_lsp" }
pulldown-cmark = { version = "0.13", default-features = false }
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
time = { version = "0.3", features = ["parsing"] }
toml = "1"
miniz_oxide = "0.8"
webbrowser = "1"
web-time = "1"
uuid = "1"
rhai = { version = "1.25.1", features = ["serde"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8", features = ["json", "ws"] }
getrandom_03 = { package = "getrandom", version = "0.3" }
hmac = "0.12"
libc = "0.2"
libghostty-vt = "0.2.1"
portable-pty = "0.9.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
similar = { version = "3.2", features = ["wasm32_web_time"] }
js-sys = "0.3"
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "Location", "Window", "Storage", "XmlHttpRequest", "WebSocket", "BinaryType", "MessageEvent", "UrlSearchParams", "console", "HtmlCanvasElement", "History", "Request", "RequestInit", "Headers"] }

[target.'cfg(target_os = "linux")'.dependencies]
moon_launcher = { version = "0.1", path = "crates/moon_launcher" }
moon_display = { version = "0.1", path = "crates/moon_display" }
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.19", default-features = false }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAttributedString", "NSObjCRuntime", "NSRange", "NSString"] }
wry = { version = "0.57", default-features = false }

[build-dependencies]
wasm-bindgen-cli-support = "=0.2.126"
flate2 = "1"

[dev-dependencies]
flate2 = "1"
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
# Nobody steps through egui or tokio, and their debug info was most of a 15 GB target/debug/deps.
# A panic's backtrace still names their functions, without the file and line.
debug = false

# `"*"` is every package but this one, which takes in the crates under crates/ - each is a
# workspace of its own. Those are stepped through, so they keep their debug info.
[profile.dev.package.egui_frames]
debug = true
[profile.dev.package.egui_tty]
debug = true
[profile.dev.package.egui_moon_editor]
debug = true
[profile.dev.package.egui_moon_code_ide]
debug = true
[profile.dev.package.moon_lsp]
debug = true
[profile.dev.package.moon_launcher]
debug = true
[profile.dev.package.libghostty-vt-sys]
debug = true

# build.rs runs wasm-bindgen and gzip over the whole browser build - 17 MB - on every build of
# moon whose sources changed. Cargo compiles what a build script uses unoptimized, which makes
# those two take seconds each; these are compiled optimized in every profile instead.
[profile.dev.package.walrus]
opt-level = 3
[profile.dev.package.wasm-bindgen-cli-support]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.release.package.walrus]
opt-level = 3
[profile.release.package.wasm-bindgen-cli-support]
opt-level = 3
[profile.release.package.miniz_oxide]
opt-level = 3
[profile.release.package.flate2]
opt-level = 3

# Ghostty's VT engine built for the browser as well - see crates/libghostty-vt-sys/VENDORED.md.
[patch.crates-io]
libghostty-vt-sys = { path = "crates/libghostty-vt-sys" }
